services:
  postgres:
    image: postgres:16-alpine
    container_name: video-reposter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: videoreposter
      POSTGRES_PASSWORD: videoreposter
      POSTGRES_DB: video_reposter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoreposter -d video_reposter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
